<!doctype html>
<html lang="en" class="h-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Final Portfolio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="scripting.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="h-100 text-center text-bg-dark">
    <div class="d-flex w-100 h-100 flex-column">
      <header class="main-header"></header>
      <main>
        <h1>Contact Me</h1>
        <p>Got any questions? Contact me below:</p>
        <div class="contact-container">
          <div class="contact-form">
            <form method="OK" action="/request.html">
              <div class="contact-thin">
                <label for="name" class="form-label mb-2">Name:</label>
                <input
                  type="text"
                  id="name"
                  name="username"
                  class="form-control mb-2"
                />
                <label for="email" class="form-label mb-2">Email:</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="form-control mb-2"
                />
                <label for="question" class="form-label"
                  >What do you want to say?</label
                >
                <textarea
                  name="textarea"
                  id="question"
                  class="form-control mb-2"
                ></textarea>
              </div>

              <div class="contact-buttons">
                <input
                  type="submit"
                  value="Submit Form"
                  class="contact-submit"
                />
                <input type="reset" value="Reset Form" class="contact-reset" />
              </div>
            </form>
          </div>
        </div>
      </main>
      <footer class="main-footer"></footer>
    </div>
  </body>
</html>
